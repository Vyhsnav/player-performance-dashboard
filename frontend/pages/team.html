<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Information</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
        }

        header {
            background: #161b22;
            padding: 20px 40px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        header h1 {
            font-size: 1.5rem;
            color: #58a6ff;
            margin-left: auto;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .team-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            background: #161b22;
            padding: 24px;
            border-radius: 10px;
            border: 1px solid #30363d;
        }

        .team-header img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .team-header h2 {
            font-size: 1.8rem;
        }

        .team-header p {
            color: #8b949e;
            margin-top: 4px;
        }

        .squad-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .player-card {
            background: #161b22;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
        }

        .player-card:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }

        .player-card .name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .player-card .position {
            color: #8b949e;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .section-title {
            font-size: 1rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 24px 0 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    
    <header>
        <a href="../index.html">← Back to Standings</a>
        <h1>⚽ Player Performance Dashboard</h1>
    </header>

    <div class="container">
        <div id="team-header" class="team-header">
            <p class="loading">Loading team information...</p>
        </div>
        <div id="squad"></div>
    </div>

    <script>
        const BASE_URL = "http://localhost:3001";

        const params = new URLSearchParams(window.location.search);
        const teamId = params.get("id");

        async function loadTeam() {
            const res = await fetch(`${BASE_URL}/api/team/${teamId}`);
            const data = await res.json();

            //team header
            document.getElementById("team-header").innerHTML = `
                <img src="${data.crest}" alt="${data.name}" />
                <div>
                    <h2>${data.name}</h2>
                    <p>📍 ${data.venue} &nbsp;|&nbsp; Founded: ${data.founded}</p>
                </div>
            `;

            //group players by position
            const groups = {};
            data.squad.forEach(player => {
                const pos = player.position || "Unknown";
                if (!groups[pos]) groups[pos] = [];
                groups[pos].push(player);
            });

            //render players
            let html = "";
            for (const [position, players] of Object.entries(groups)) {
                html += `<h3 class="section-title">${position}</h3>`;
                html += `<div class="squad-grid">`;
                players.forEach(player => {
                    html += `
                        <div class="player-card" onclick="window.location.href='player.html?id=${player.id}&teamId=${teamId}'">
                            <div class="name">${player.name}</div>
                            <div class="position">${player.position}</div>
                        </div>
                    `;
                });
                html += `</div>`;

            }

            document.getElementById("squad").innerHTML = html;
        }

        loadTeam();
    </script>

</body>
</html>
